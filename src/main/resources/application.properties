server.port=4040
spring.application.name=IETScroll
server.admin.email=${ADMIN_EMAIL}
server.address=0.0.0.0
app.self-url=https://student-community-platform-ietscroll.onrender.com

#Database
spring.datasource.url=${SUPABASE_DB_URL}?prepareThreshold=0
#spring.datasource.username=postgres
#For deploymenet
spring.datasource.username=postgres.tuejfxqyrypbbmfvgole
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


#AI for content checking (general chat/team moderation)
spring.ai.openai.api-key=${NVIDIA_API_KEY}
spring.ai.openai.base-url=https://integrate.api.nvidia.com
spring.ai.openai.chat.options.model=nvidia/nemotron-3.5-bolt-e4b

#AI for resume rating (same key, different model set in AIConfiguration.java)
spring.ai.openai.api-llama-key=${NVIDIA_API_KEY}

#AI strict spam/safety check
spring.ai.openai.api-safety-key=${NVIDIA_API_KEY}

#JWT
jwt.secret=${JWT_SECRET}

#actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

#Email
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Images
cloudinary.cloud-name = ${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key = ${CLOUDINARY_API_KEY}
cloudinary.api-secret = ${CLOUDINARY_API_SECRET}

#Verification of image
sightengine.api-user = ${SIGHTENGINE_API_USER}
sightengine.api-secret = ${SIGHTENGINE_API_SECRET}
sightengine.api-url=https://api.sightengine.com/1.0/check.json
